name: Keep backend awake

# Render's free web service sleeps after 15 minutes without traffic, and waking it
# takes minutes. Pinging /health every 10 minutes keeps it warm. A service that never
# sleeps uses about 744 of the 750 free instance hours Render gives each workspace
# per month, so this only fits if it is the workspace's only free service.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping backend health check
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://oral-cancer-app-nlq8.onrender.com' }}
        run: curl --fail --silent --show-error --max-time 300 "$BACKEND_URL/health"
